# EndoWAM endowam_pseudo_z60 merge fragment. Sync the Drive folder so that the
# data root contains ureter/, ercp/, and esophagus/, then point data_root_dir at
# that local root. The source files use a LeRobot v2.1-compatible layout.
datasets:
  vla_data:
    data_root_dir: /path/to/endowam_pseudo_z60
    data_mix: endowam_pseudo_z60
    dataset_py: lerobot_datasets

    discrete_actions: true
    action_horizon: 64
    action_dim: 3
    max_action_dim: 3
    max_state_dim: 3
    # The loader derives action_delta_indices as range(action_horizon).

    # Verified against the Drive parquet data. These are semantic values, not
    # class ids, and no continuous-to-discrete threshold is applied.
    action_class_values: [-1, 0, 1]
    action_target_format: values

    # These keys are registered as robot_type=endowam_endoscope. They are kept
    # explicit here as a schema guard when composing custom configs.
    modality_keys:
      video: [video.endoscope]
      state: [state.endoscope_state]
      action: [action.endoscope_cmd]
      language: [annotation.human.action.task_description]

    video_backend: decord
